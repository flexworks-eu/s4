name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache 
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - name: Checkout source project
        uses: actions/checkout@v4
        with:
          repository: opensourceworks-org/object-storage-proxy
          path: object-storage-proxy
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            object-storage-proxy/target
          key: cargo-doc-${{ hashFiles('object-storage-proxy/Cargo.lock') }}
          restore-keys: cargo-doc-
      - name: Build cargo doc
        working-directory: object-storage-proxy
        run: cargo doc --no-deps --document-private-items
      - name: Copy cargo doc into docs/api
        run: |
          mkdir -p docs/api
          cp -r object-storage-proxy/target/doc/* docs/api/
      - run: mkdocs gh-deploy --force